name: Release

# Publishes to npm with Trusted Publishing (OIDC): no npm token is stored in the repo.
# npmjs.com > package settings > Trusted Publisher must list this repository and the
# workflow filename "release.yml" exactly (case-sensitive).

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm & GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # OIDC token for npm Trusted Publishing (also enables provenance)

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Verify package.json and plugin.xml versions match tag
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          PLUGIN_VERSION=$(node -p "/<plugin[^>]*\sversion=\"([^\"]+)\"/.exec(require('fs').readFileSync('plugin.xml', 'utf8'))[1]")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ] || [ "$PLUGIN_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: tag=$TAG_VERSION package.json=$PKG_VERSION plugin.xml=$PLUGIN_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN: npm exchanges the workflow's OIDC token for a short-lived
      # publish credential. Provenance is generated automatically.
      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
